# 전체 스택을 한 번에 실행한다 (MySQL, Redis, migrate, backend 2개, frontend)
#
#   docker compose up -d --wait        실행. 접속 주소는 http://localhost:8088
#   docker compose ps                  상태
#   docker compose logs -f backend     로그
#   docker compose down                종료 (데이터까지 지우려면 -v)
#
# 비밀번호는 이 파일에 적지 않는다. 같은 폴더의 .env 에서 읽는다(.env 는 저장소에 올리지 않는다).
name: ticketing

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 가 필요하다}
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing                      # 스키마 소유자. migrate가 쓴다
      MYSQL_PASSWORD: ${DB_OWNER_PASSWORD:?.env 에 DB_OWNER_PASSWORD 가 필요하다}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?.env 에 DB_APP_PASSWORD 가 필요하다}   # mysql-init 스크립트가 앱 계정을 만들 때 쓴다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP(127.0.0.1)로 확인한다. 초기화 중인 임시 서버는 소켓만 열어 이 검사에 실패한다
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 가 필요하다}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 테이블 생성과 시드만 하고 끝난다. MySQL이 준비된 뒤에 실행된다
  migrate:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: harpda/ticketing-backend:${APP_VERSION:-dev}
    command: ["migrate"]
    environment:
      DB_HOST: mysql
      DB_USER: ticketing
      DB_PASSWORD: ${DB_OWNER_PASSWORD}
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # migrate가 성공하고 Redis가 준비된 뒤에 실행된다
  backend:
    image: harpda/ticketing-backend:${APP_VERSION:-dev}
    environment:
      DB_HOST: mysql
      DB_USER: ticketing_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_COOKIE_SECURE: "false"             # http로 접속하므로 끈다
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # nginx는 시작할 때 backend 이름을 찾는다. backend가 healthy가 된 뒤에 실행된다
  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: harpda/ticketing-frontend:${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:8088:8080"                    # 이 PC에서만 접속된다
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
