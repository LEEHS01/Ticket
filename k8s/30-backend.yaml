# API 서버. 세션이 Redis에 있어 Pod를 여러 개로 늘려도 로그인이 유지된다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticketing
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 새 Pod를 하나 먼저 띄우고
      maxUnavailable: 0    # Ready인 Pod 수가 2 아래로 내려가지 않게 한다
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001           # 이미지의 app 사용자
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # 두 Pod를 서로 다른 worker에 나눠 둔다(노드 하나가 멈춰도 하나는 남는다)
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend
      containers:
      - name: backend
        image: harpda/ticketing-backend:1.1
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: ticketing-config
        env:
        - name: DB_USER                    # SELECT/INSERT/UPDATE만 가진 앱 계정
          value: ticketing_app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: ticketing-secret, key: DB_APP_PASSWORD}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef: {name: ticketing-secret, key: REDIS_PASSWORD}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests: {cpu: 250m, memory: 384Mi}
          limits: {memory: 512Mi}        # 힙은 이 값의 75%(이미지의 MaxRAMPercentage)
        # 기동이 끝날 때까지(최대 120초) liveness · readiness를 미룬다
        startupProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 2
          failureThreshold: 60
        # 프로세스가 응답하지 않으면 재시작
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        # DB · Redis에 닿지 않으면 Service에서 빼기만 한다(재시작하지 않는다)
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        lifecycle:
          # 종료 신호 전에 5초 기다린다. 그동안 Service의 엔드포인트에서 빠져 새 요청이 오지 않는다
          preStop:
            sleep: {seconds: 5}
      volumes:
      - name: tmp
        emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ticketing
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8080
    targetPort: http
