# 비밀번호 Secret 예시. 키 목록을 보여 주기 위한 파일이라 k8s/ 바로 아래가 아닌 examples/ 에 둔다(kubectl apply -f k8s/ 에 포함되지 않는다).
# 실제 Secret은 저장소 루트의 .env 로 만든다(.env 는 .gitignore 로 제외된다):
#
#   cp .env.example .env
#   for k in MYSQL_ROOT_PASSWORD DB_OWNER_PASSWORD DB_APP_PASSWORD REDIS_PASSWORD; do
#     sed -i "s/^$k=$/$k=$(openssl rand -hex 16)/" .env
#   done
#   kubectl create secret generic ticketing-secret -n ticketing --from-env-file=.env
#
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secret
  namespace: ticketing
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<root 비밀번호>"      # MySQL root. mysql 컨테이너만 쓴다
  DB_OWNER_PASSWORD: "<스키마 소유자 비밀번호>"   # ticketing 계정. migrate Job만 쓴다
  DB_APP_PASSWORD: "<앱 계정 비밀번호>"         # ticketing_app 계정. backend가 쓴다
  REDIS_PASSWORD: "<Redis 비밀번호>"
