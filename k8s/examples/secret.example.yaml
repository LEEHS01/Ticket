# Secret에 들어가는 키를 보여 주는 예시. 값이 없는 파일이라 적용하지 않는다.
# 실제 Secret은 저장소 루트의 .env 로 만든다(.env 는 .gitignore 로 제외된다):
#
#   kubectl create secret generic ticketing-secret -n ticketing --from-env-file=.env
#
apiVersion: v1
kind: Secret
metadata:
  name: ticketing-secret
  namespace: ticketing
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<root 비밀번호>"         # MySQL root. mysql 컨테이너가 쓴다
  DB_OWNER_PASSWORD: "<스키마 소유자 비밀번호>"   # ticketing 계정. migrate Job이 쓴다
  DB_APP_PASSWORD: "<앱 계정 비밀번호>"          # ticketing_app 계정. backend가 쓴다
  REDIS_PASSWORD: "<Redis 비밀번호>"             # redis와 backend가 쓴다
