# 스키마 생성(Flyway)과 시드를 한 번 실행하고 끝나는 Job. backend보다 먼저 실행한다.
# Job은 수정할 수 없으므로 다시 실행하려면 지우고 다시 만든다:
#   kubectl delete job migrate -n ticketing && kubectl apply -f migrate-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ticketing
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # MySQL이 접속을 받을 때까지 기다린다
      - name: wait-mysql
        image: busybox:1.37
        command: ["sh", "-c", "until nc -z -w 2 mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
      - name: migrate
        image: harpda/ticketing-backend:3.0
        args: ["migrate"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        envFrom:
        - configMapRef:
            name: ticketing-config
        env:
        - name: DB_USER                    # 테이블을 만들 수 있는 스키마 소유자
          value: ticketing
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ticketing-secret
              key: DB_OWNER_PASSWORD
      volumes:
      - name: tmp
        emptyDir: {}
