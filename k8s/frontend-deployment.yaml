# 화면(nginx). 정적 파일을 주고, /api 요청은 backend Service로 전달한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticketing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 새 Pod를 하나 먼저 띄운다
      maxUnavailable: 0    # 새 Pod가 Ready가 되기 전에는 기존 Pod를 줄이지 않는다
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: harpda/ticketing-frontend:2.1
        ports:
        - containerPort: 8080
        lifecycle:
          # 종료 신호를 보내기 전에 5초 기다린다. 그동안 이 Pod가 Service 대상에서 빠져 새 요청이 오지 않는다
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
