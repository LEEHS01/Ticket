# backend와 frontend 전용 ServiceAccount. 두 앱은 쿠버네티스 API를 호출하지 않으므로 토큰을 Pod에 넣지 않는다.
# Role을 연결하지 않아 API 권한도 없다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: ticketing
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: ticketing
automountServiceAccountToken: false
