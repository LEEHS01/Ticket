# 비밀이 아닌 설정. 키 이름이 곧 환경 변수 이름이다.
# 값을 바꾼 뒤에는 kubectl rollout restart deployment/backend -n ticketing 으로 Pod를 교체해야 반영된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-config
  namespace: ticketing
data:
  DB_HOST: mysql                    # mysql Service 이름
  DB_PORT: "3306"
  DB_NAME: ticketing
  REDIS_HOST: redis                 # redis Service 이름
  REDIS_PORT: "6379"
  SESSION_COOKIE_SECURE: "false"    # http로 접속하므로 끈다
  QUEUE_MAX_ACTIVE: "100"           # 회차당 좌석 화면 동시 입장 인원
  HOLD_SECONDS: "300"               # 좌석 선점 유지 시간(초)
