# 노드 비우기(drain) 같은 자발적 중단에서도 backend · frontend가 최소 1개는 남게 한다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: ticketing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: ticketing
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
