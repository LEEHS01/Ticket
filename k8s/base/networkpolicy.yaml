# DB와 Redis에는 backend와 migrate Pod만 접속하게 한다(Calico가 적용한다).
# Docker 단계의 internal 네트워크(data)에 해당한다. Service가 ClusterIP라 클러스터 밖에서는 원래 닿지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-app
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [backend, migrate]}
    ports:
    - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-app
  namespace: ticketing
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - {key: app, operator: In, values: [backend, migrate]}
    ports:
    - port: 6379
