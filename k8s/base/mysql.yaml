# MySQL: Pod 1개 + PVC. 데이터는 PVC(local-path, 노드 디스크)에 저장되어 Pod를 바꿔도 남는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: ticketing
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName을 적지 않으면 기본 StorageClass(local-path)를 쓴다
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ticketing
spec:
  replicas: 1
  # 기존 Pod를 먼저 종료하고 새 Pod를 만든다. 두 MySQL이 같은 데이터 디렉터리를 동시에 쓰지 않게 한다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_0900_ai_ci
        - --default-time-zone=+00:00
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: ticketing
        - name: MYSQL_USER                 # 스키마 소유자(마이그레이션 전용)
          value: ticketing
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: {name: ticketing-secret, key: MYSQL_ROOT_PASSWORD}
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: {name: ticketing-secret, key: DB_OWNER_PASSWORD}
        - name: DB_APP_PASSWORD            # mysql-init 스크립트가 앱 계정을 만들 때 쓴다
          valueFrom:
            secretKeyRef: {name: ticketing-secret, key: DB_APP_PASSWORD}
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
        # 처음 기동할 때는 초기화(임시 서버, TCP 꺼짐)에 시간이 걸린다. 끝날 때까지 liveness를 미룬다
        startupProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql-data
      - name: init
        configMap:
          name: mysql-init
          defaultMode: 0555
---
# ClusterIP: 클러스터 안에서만 접근된다(NodePort 없음)
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ticketing
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
