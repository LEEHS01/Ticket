# 화면(nginx). 정적 파일을 주고, /api 요청은 backend Service로 전달한다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ticketing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 새 Pod를 하나 먼저 띄운다
      maxUnavailable: 0    # 새 Pod가 Ready가 되기 전에는 기존 Pod를 줄이지 않는다
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend         # 토큰을 넣지 않는 전용 ServiceAccount (serviceaccount.yaml)
      # 이미지의 nginx 사용자(101)로 실행한다
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Pod 2개를 서로 다른 노드에 둔다
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: frontend
        # 같은 ReplicaSet의 Pod끼리만 센다. 이 줄이 없으면 교체 중에 예전 Pod까지 세어 새 Pod가 한 노드에 몰린다
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: frontend
        image: harpda/ticketing-frontend
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true     # nginx의 pid 파일과 임시 파일은 /tmp 에 둔다
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          # 종료 신호를 보내기 전에 5초 기다린다. 그동안 이 Pod가 Service 대상에서 빠져 새 요청이 오지 않는다
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
