# API 서버. 로그인 세션이 Redis에 있어 Pod를 여러 개로 늘려도 로그인이 유지된다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ticketing
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 새 Pod를 하나 먼저 띄운다
      maxUnavailable: 0    # 새 Pod가 Ready가 되기 전에는 기존 Pod를 줄이지 않는다
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # preStop 5초 + 진행 중인 요청을 마치는 시간(최대 20초)보다 길게 둔다
      terminationGracePeriodSeconds: 40
      serviceAccountName: backend          # 토큰을 넣지 않는 전용 ServiceAccount (serviceaccount.yaml)
      # 이미지의 app 사용자(10001)로 실행한다. root로 실행되는 이미지면 Pod가 시작되지 않는다
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Pod 2개를 서로 다른 노드에 둔다. 노드 하나가 멈춰도 하나는 남는다
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend
        # 같은 ReplicaSet의 Pod끼리만 센다. 이 줄이 없으면 교체 중에 예전 Pod까지 세어 새 Pod가 한 노드에 몰린다
        matchLabelKeys:
        - pod-template-hash
      containers:
      - name: backend
        image: harpda/ticketing-backend
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true     # 컨테이너 파일 시스템을 읽기 전용으로 둔다. 쓰기는 /tmp 에만 한다
          capabilities:
            drop: ["ALL"]
        # 요청량은 스케줄러가 노드를 고를 때 쓴다. 메모리 한도는 JVM 힙 크기의 기준이 된다(한도의 75%)
        resources:
          requests:
            cpu: 250m
            memory: 384Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        lifecycle:
          # 종료 신호를 보내기 전에 5초 기다린다. 그동안 이 Pod가 Service 대상에서 빠져 새 요청이 오지 않는다
          preStop:
            sleep:
              seconds: 5
        envFrom:
        - configMapRef:
            name: ticketing-config
        env:
        - name: DB_USER                    # SELECT, INSERT, UPDATE만 가진 앱 계정
          value: ticketing_app
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ticketing-secret
              key: DB_APP_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ticketing-secret
              key: REDIS_PASSWORD
        # 프로세스가 응답하지 않으면 컨테이너를 재시작한다
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 60
          timeoutSeconds: 2
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        # MySQL과 Redis에 연결되지 않으면 Service 대상에서 뺀다(재시작하지 않는다)
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 2
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
