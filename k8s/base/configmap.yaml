# 비밀이 아닌 설정. 바꾼 뒤에는 kubectl rollout restart deployment/backend -n ticketing 로 Pod를 교체한다
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-config
  namespace: ticketing
data:
  DB_HOST: mysql                    # mysql Service 이름
  DB_PORT: "3306"
  DB_NAME: ticketing
  REDIS_HOST: redis                 # redis Service 이름
  REDIS_PORT: "6379"
  SESSION_COOKIE_SECURE: "false"    # NodePort는 http라서 끈다. HTTPS인 EKS에서는 true
  QUEUE_MAX_ACTIVE: "100"           # 회차당 좌석 화면 동시 입장 인원
  HOLD_SECONDS: "300"               # 좌석 선점 유지 시간(초)
---
# MySQL 데이터 디렉터리가 비어 있을 때 한 번 실행된다(/docker-entrypoint-initdb.d).
# Docker 단계의 backend/docker/mysql-init/01-init.sh 에서 테스트 DB 부분을 뺐다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: ticketing
data:
  01-init.sh: |
    #!/bin/bash
    # ticketing_app: API 서버용 계정. SELECT/INSERT/UPDATE만 준다(DROP·ALTER·DELETE 불가)
    set -euo pipefail
    : "${DB_APP_PASSWORD:?DB_APP_PASSWORD 가 필요합니다}"
    mysql -uroot -p"${MYSQL_ROOT_PASSWORD}" <<SQL
    CREATE USER IF NOT EXISTS 'ticketing_app'@'%' IDENTIFIED BY '${DB_APP_PASSWORD}';
    GRANT SELECT, INSERT, UPDATE ON ticketing.* TO 'ticketing_app'@'%';
    FLUSH PRIVILEGES;
    SQL
