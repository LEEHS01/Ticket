# Secrets Manager의 ticketing/eks/backend 를 backend Pod에 파일로 붙이고, K8s Secret으로도 동기화한다.
# 인증은 Pod의 ServiceAccount(backend)에 연결한 IAM 역할로 한다(EKS Pod Identity).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
  namespace: ticketing
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "ticketing/eks/backend"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_APP_PASSWORD
            objectAlias: DB_APP_PASSWORD
          - path: REDIS_PASSWORD
            objectAlias: REDIS_PASSWORD
  secretObjects:
  - secretName: backend-from-secrets-manager
    type: Opaque
    data:
    - objectName: DB_APP_PASSWORD
      key: DB_APP_PASSWORD
    - objectName: REDIS_PASSWORD
      key: REDIS_PASSWORD
