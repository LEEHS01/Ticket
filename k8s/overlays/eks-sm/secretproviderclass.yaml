# Secrets Manager의 ticketing/eks/backend 를 backend Pod에 파일로 붙이고, 쿠버네티스 Secret으로도 만들어 둔다.
# backend는 비밀번호를 환경 변수로 받으므로 Secret이 필요하다. 이 Secret은 backend Pod가 떠 있는 동안만 존재한다.
# AWS 인증은 ServiceAccount(backend)에 연결한 IAM 역할로 한다(EKS Pod Identity)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secrets
  namespace: ticketing
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "ticketing/eks/backend"
        objectType: "secretsmanager"
        jmesPath:
          - path: DB_APP_PASSWORD
            objectAlias: DB_APP_PASSWORD
          - path: REDIS_PASSWORD
            objectAlias: REDIS_PASSWORD
  secretObjects:
  - secretName: backend-from-secrets-manager
    type: Opaque
    data:
    - objectName: DB_APP_PASSWORD
      key: DB_APP_PASSWORD
    - objectName: REDIS_PASSWORD
      key: REDIS_PASSWORD
