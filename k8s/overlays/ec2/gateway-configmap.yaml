# gateway(nginx) 설정. Docker 단계의 gateway/nginx.conf 와 같고, 대상 주소만 Service 이름으로 바꿨다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: ticketing
data:
  nginx.conf: |
    #   /api/*  → backend Service(8080)
    #   그 외   → frontend Service(8080)
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        access_log /dev/stdout;
        server_tokens off;
        client_max_body_size 16k;

        server {
            listen 8080;
            server_name _;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # 클라이언트가 보낸 X-Forwarded-For는 믿지 않고 실제 접속 IP로 덮어쓴다
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;

            # gateway 자신의 상태 확인(프로브용)
            location = /gateway-healthz {
                access_log off;
                return 200 "ok\n";
            }

            # Service의 ClusterIP는 Service를 지우기 전까지 바뀌지 않으므로, 시작할 때 한 번 해석해도 된다.
            # (Docker 단계는 컨테이너 IP가 바뀌어서 resolver로 매 요청 해석했다)
            location /api/ {
                proxy_pass http://backend:8080;
            }

            location / {
                proxy_pass http://frontend:8080;
            }
        }
    }
