# 선택 과제: EC2 kubeadm 클러스터에서 Gateway API로 노출.  kubectl apply -k k8s/overlays/ec2-gateway
# 먼저 Envoy Gateway를 설치한다:
#   kubectl apply --server-side -f https://github.com/envoyproxy/gateway/releases/download/v1.9.3/install.yaml
# ec2 overlay의 nginx gateway(Deployment · Service · ConfigMap)는 쓰지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- gateway.yaml
