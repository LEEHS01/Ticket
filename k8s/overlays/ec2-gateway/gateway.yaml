# 선택 과제: nginx gateway 대신 Gateway API(Envoy Gateway)로 노출한다.
# EC2에는 로드밸런서가 없으므로 Envoy 프록시 Service를 NodePort 30080으로 고정한다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
  namespace: ticketing
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster      # 어느 노드로 들어와도 프록시 Pod로 전달된다
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - name: http-80
                port: 80
                protocol: TCP
                nodePort: 30080             # 보안 그룹에서 연 포트
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ticketing
  namespace: ticketing
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: nodeport
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
# 경로 분기: nginx.conf의 location 두 개가 HTTPRoute 규칙 두 개가 된다
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ticketing
  namespace: ticketing
spec:
  parentRefs:
  - name: ticketing
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 8080
