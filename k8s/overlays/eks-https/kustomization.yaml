# 선택 과제: eks-rds overlay + 도메인 · HTTPS.  ACM 인증서가 발급된 뒤 적용한다.
#   CERT=$(aws acm list-certificates --query "CertificateSummaryList[?DomainName=='nyannyanpunch.cloud'].CertificateArn" --output text)
#   kubectl kustomize k8s/overlays/eks-https | sed "s/ACCOUNT_ID/$ACCOUNT/g; s/RDS_ENDPOINT/$RDS/g; s|CERT_ARN|$CERT|g" | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../eks-rds

patches:
# ALB에 HTTPS(443) 리스너와 인증서를 붙이고, HTTP(80)는 HTTPS로 넘긴다
- target: {kind: Ingress, name: ticketing}
  patch: |-
    - op: add
      path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
      value: '[{"HTTP":80},{"HTTPS":443}]'
    - op: add
      path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect
      value: "443"
    - op: add
      path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
      value: CERT_ARN
# HTTPS가 됐으므로 세션 쿠키에 Secure를 건다(앱의 기본값). HTTP로는 쿠키가 전송되지 않는다
- target: {kind: ConfigMap, name: ticketing-config}
  patch: |-
    - op: replace
      path: /data/SESSION_COOKIE_SECURE
      value: "true"
