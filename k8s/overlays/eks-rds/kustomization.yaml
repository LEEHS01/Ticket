# EKS + Amazon RDS. 클러스터 안의 MySQL을 빼고 RDS에 접속한다. 먼저 infra/eks/rds.sh 로 RDS를 만든다
#   RDS=$(aws rds describe-db-instances --db-instance-identifier ticketing-rds --query 'DBInstances[0].Endpoint.Address' --output text)
#   kubectl kustomize k8s/overlays/eks-rds | sed "s/ACCOUNT_ID/$ACCOUNT/; s/RDS_ENDPOINT/$RDS/" | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../eks

patches:
# DB 주소를 RDS로 바꾸고 TLS 접속만 허용한다
- target:
    kind: ConfigMap
    name: ticketing-config
  patch: |-
    - op: replace
      path: /data/DB_HOST
      value: RDS_ENDPOINT
    - op: add
      path: /data/DB_SSL_MODE
      value: REQUIRED
# 클러스터 안의 MySQL 리소스는 만들지 않는다
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mysql
      namespace: ticketing
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: mysql
      namespace: ticketing
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mysql-data
      namespace: ticketing
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: mysql-init
      namespace: ticketing
