# backend 자동 확장. 평균 CPU 사용률이 요청량(250m)의 60%를 넘으면 Pod를 2개에서 최대 6개까지 늘린다.
# Pod가 늘어 노드가 모자라면 Auto Mode가 노드를 추가한다
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: ticketing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120     # 부하가 줄어도 2분은 지켜본 뒤 줄인다
