# ALB로 노출한다. ③의 gateway(nginx)가 하던 경로 분기(/ → frontend, /api → backend)를 ALB가 대신한다.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing        # 인터넷에서 접속하는 ALB. 공용 서브넷(kubernetes.io/role/elb 태그)에 만들어진다
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
spec:
  controller: eks.amazonaws.com/alb     # Auto Mode에 내장된 로드밸런서 컨트롤러
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing
  namespace: ticketing
  annotations:
    alb.ingress.kubernetes.io/target-type: ip     # 노드를 거치지 않고 Pod IP로 바로 보낸다
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
