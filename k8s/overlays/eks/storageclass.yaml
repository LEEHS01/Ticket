# EKS Auto Mode는 StorageClass를 만들어 두지 않는다. EBS gp3 볼륨을 만드는 StorageClass를 기본으로 둔다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com      # Auto Mode에 내장된 EBS CSI 드라이버
volumeBindingMode: WaitForFirstConsumer     # Pod가 배치된 가용 영역에 볼륨을 만든다
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
