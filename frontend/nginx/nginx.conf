# 미리내 마당 프론트엔드 nginx 설정: 정적 파일 서빙 + /api 프록시
# pid와 임시 파일은 /tmp 아래에 둔다.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # 컴파일 기본값(/var/cache/nginx/...) 대신 전부 /tmp 아래로 → 루트 FS 쓰기 불필요
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    # 로그는 stdout에 JSON 한 줄씩(계약 3.3). 쿼리스트링은 남기지 않는다($uri만 기록).
    log_format json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # 리다이렉트 응답에 내부 포트(8080)와 호스트를 넣지 않는다
        absolute_redirect off;
        port_in_redirect off;

        include /etc/nginx/snippets/security-headers.conf;

        # 쿠버네티스 liveness/readiness 프로브용. 디스크를 읽지 않는다.
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # 해시가 붙은 빌드 결과물: 내용이 바뀌면 파일명이 바뀌므로 1년 캐시
        location /assets/ {
            limit_except GET { deny all; }
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 공연 포스터 이미지(public/posters). 파일명에 해시가 없어 같은 이름으로 바뀔 수 있으므로
        # immutable 1년이 아니라 하루 캐시 후 재검증(ETag·Last-Modified → 304). 없는 파일은 index.html이 아니라 404.
        location /posters/ {
            limit_except GET { deny all; }
            try_files $uri =404;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=86400, must-revalidate" always;
        }

        # 앱 셸: 매번 서버에 재검증해야 새 배포가 바로 반영된다
        location = /index.html {
            limit_except GET { deny all; }
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # /api 는 backend 로 전달한다. backend 는 Docker 네트워크의 컨테이너 이름이자 쿠버네티스 Service 이름이다.
        # 이름은 nginx가 시작할 때 한 번 해석하므로, backend 가 먼저 있어야 nginx가 시작된다.
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # 클라이언트가 보낸 X-Forwarded-For는 믿지 않고 실제 접속 IP로 덮어쓴다
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        # 점으로 시작하는 파일은 노출하지 않는다
        location ~ /\. {
            deny all;
            return 404;
        }

        # SPA 라우팅: 실제 파일이 없으면 index.html(→ 위 no-cache 블록)로
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ /index.html;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
        }
    }
}
