# 보안 헤더. nginx는 location에서 add_header를 하나라도 쓰면 상위 add_header를 상속하지 않으므로
# 이 파일을 server와 add_header가 있는 모든 location에서 include한다.

# 스크립트·스타일·폰트·이미지·API 모두 같은 출처만 허용. 인라인 스크립트/스타일·eval 불가.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# frame-ancestors를 모르는 오래된 브라우저용
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
