# 로컬 통합용 게이트웨이. 운영(EKS)에서는 이 역할을 ALB Ingress가 한다.
#   /api/*  → backend:8080
#   그 외   → frontend:8080
# non-root, 읽기 전용 루트 FS로 실행된다(쓰기는 /tmp만).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16k;

    # 컨테이너가 다시 만들어져 IP가 바뀌어도 따라가도록 Docker 내장 DNS로 매 요청 해석
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # 클라이언트가 보낸 X-Forwarded-For는 믿지 않고 실제 접속 IP로 덮어쓴다(요청 제한 우회 방지)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
        }

        location / {
            set $frontend http://frontend:8080;
            proxy_pass $frontend;
        }
    }
}
