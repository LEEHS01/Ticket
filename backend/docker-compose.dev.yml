# 로컬 개발·통합 테스트용 MySQL 8 + Redis 7 (백엔드 앱은 띄우지 않는다).
#   docker compose -f docker-compose.dev.yml up -d
# 비밀번호는 이 파일에 적지 않는다. 같은 폴더의 .env 에서 읽는다(cp .env.example .env 후 값을 채운다).
# 운영(RDS/ElastiCache)에서는 K8s Secret 등으로 따로 주입한다.
# 포트는 127.0.0.1에만 열어 같은 네트워크의 다른 PC에서 접속하지 못하게 한다.
name: tkbe-dev   # 백엔드 개발 전용. 조율 세션의 통합 스택(ticketing-*)과 겹치지 않는 이름

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 채우세요}
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing                        # 마이그레이션(DDL)용 소유자 계정
      MYSQL_PASSWORD: ${DB_OWNER_PASSWORD:?.env 에 DB_OWNER_PASSWORD 를 채우세요}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?.env 에 DB_APP_PASSWORD 를 채우세요}   # mysql-init/01-init.sh 가 쓴다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:13306:3306"   # 호스트 13306 (통합 스택·다른 MySQL과 충돌 방지)
    volumes:
      - mysql-data:/var/lib/mysql
      # 앱 전용 최소 권한 계정(ticketing_app)과 통합 테스트 DB를 만든다. 볼륨이 처음 생성될 때만 실행된다.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1(TCP)로 확인해야 초기화용 임시 서버(소켓 전용) 단계를 "준비됨"으로 오인하지 않는다.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 채우세요}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no"]
    ports:
      - "127.0.0.1:16379:6379"   # 호스트 16379
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
