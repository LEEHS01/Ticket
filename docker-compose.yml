# 전체 스택 로컬 통합 실행 (EKS 배포 전 리허설)
#
#   docker compose up -d --build      → http://localhost:8088
#   docker compose down               (DB까지 지우려면 -v)
#
# EKS와의 대응:
#   gateway   → ALB Ingress (/ 와 /api 경로 분기)
#   frontend  → Deployment + Service
#   backend   → Deployment + Service (+ HPA)
#   migrate   → Job (서버보다 먼저 1회 실행)
#   mysql     → RDS
#   redis     → ElastiCache 또는 클러스터 내부 Redis
#
# 비밀번호는 이 파일에 적지 않는다. 같은 폴더의 .env 에서 읽는다:
#   cp .env.example .env   후 값을 채운다 (.env 는 저장소에 올리지 않는다). 운영에서는 K8s Secret으로 주입한다.
name: ticketing

# 앱 컨테이너 공통 보안 설정: 읽기 전용 루트 FS, 권한 상승 금지, 리눅스 capability 전부 제거
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ticketing
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 채우세요}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 를 채우세요}
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing                      # 스키마 소유자(마이그레이션 전용)
      MYSQL_PASSWORD: ${DB_OWNER_PASSWORD:?.env 에 DB_OWNER_PASSWORD 를 채우세요}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?.env 에 DB_APP_PASSWORD 를 채우세요}   # mysql-init/01-init.sh 가 앱 계정을 만들 때 쓴다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 최소 권한 앱 계정(ticketing_app) 생성. 볼륨이 처음 만들어질 때만 실행된다.
      - ./backend/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [data]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 에 REDIS_PASSWORD 를 채우세요}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  # 스키마 생성 + 시드만 하고 종료한다. DDL 권한이 있는 소유자 계정으로 실행.
  migrate:
    build: ./backend
    image: ticketing-backend:dev
    command: ["migrate"]
    environment:
      <<: *backend-env
      DB_USER: ticketing
      DB_PASSWORD: ${DB_OWNER_PASSWORD}
      # 시연용 로그인 계정. 두 값을 모두 준 경우에만 만들어진다(비밀번호를 파일에 적지 않기 위해 실행할 때 넘긴다).
      #   PowerShell:  $env:SEED_DEMO_EMAIL="demo@example.com"; $env:SEED_DEMO_PASSWORD="<8자 이상>"; docker compose up -d
      SEED_DEMO_EMAIL: "${SEED_DEMO_EMAIL:-}"
      SEED_DEMO_PASSWORD: "${SEED_DEMO_PASSWORD:-}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [data]
    <<: *hardening

  # API 서버. 최소 권한 계정(SELECT/INSERT/UPDATE)으로 실행. 상태가 없어 여러 개로 늘릴 수 있다:
  #   docker compose up -d --scale backend=3
  backend:
    image: ticketing-backend:dev
    environment:
      <<: *backend-env
      DB_USER: ticketing_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      # 회차당 좌석 화면 동시 입장 인원. 대기 화면을 시연하려면 1로 실행:
      #   PowerShell:  $env:QUEUE_MAX_ACTIVE=1; docker compose up -d
      QUEUE_MAX_ACTIVE: "${QUEUE_MAX_ACTIVE:-100}"
      HOLD_SECONDS: "${HOLD_SECONDS:-300}"
      # 로컬은 http라 세션 쿠키의 Secure를 끈다. 운영(https)에서는 반드시 true(기본값).
      SESSION_COOKIE_SECURE: "false"
    # 복제본 2개. 로그인 세션이 Redis에 있으므로 어느 쪽으로 요청이 가도 로그인이 유지된다(K8s의 replicas에 해당).
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    networks: [data, edge]
    <<: *hardening

  frontend:
    build: ./frontend
    image: ticketing-frontend:dev
    networks: [edge]
    <<: *hardening

  gateway:
    image: nginxinc/nginx-unprivileged:1.30-alpine-slim
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8088:8080"                    # 이 PC에서만 접속 가능
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks: [edge]
    <<: *hardening

# DB·Redis는 data 네트워크에만 둔다 → frontend와 gateway에서는 접근할 수 없다(운영의 프라이빗 서브넷에 해당)
networks:
  edge:
  data:
    internal: true

volumes:
  mysql-data:
