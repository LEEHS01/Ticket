<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="580" viewBox="0 0 1060 580" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="15" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1060" height="580" fill="#fff"/>

  <rect x="20" y="230" width="120" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="80" y="260" text-anchor="middle" font-weight="bold">브라우저</text>
  <text x="80" y="282" text-anchor="middle" font-size="13">내 PC</text>

  <!-- VPC -->
  <rect x="180" y="20" width="860" height="470" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="194" y="44" font-size="14" fill="#444">AWS VPC 192.168.0.0/16 (CloudFormation) · 가용 영역 2개</text>

  <!-- public subnets -->
  <rect x="200" y="60" width="170" height="410" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="285" y="84" text-anchor="middle" font-weight="bold" font-size="14">공용 서브넷 2개</text>

  <rect x="215" y="215" width="140" height="100" rx="6" fill="#f6f6f6" stroke="#111" stroke-width="1.5"/>
  <text x="285" y="245" text-anchor="middle" font-weight="bold">ALB</text>
  <text x="285" y="267" text-anchor="middle" font-size="13">internet-facing</text>
  <text x="285" y="287" text-anchor="middle" font-size="13">HTTP 80 · 대상 Pod IP</text>

  <rect x="215" y="385" width="140" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="285" y="411" text-anchor="middle" font-weight="bold" font-size="14">NAT 게이트웨이</text>
  <text x="285" y="431" text-anchor="middle" font-size="12">영역마다 1개</text>

  <!-- private subnets / cluster -->
  <rect x="400" y="60" width="620" height="410" fill="#f6f6f6" stroke="#111" stroke-width="1.5"/>
  <text x="416" y="84" font-weight="bold" font-size="14">사설 서브넷 2개 · EKS Auto Mode 클러스터 ticketing-eks (노드는 EKS가 만듦)</text>

  <text x="416" y="112" font-size="13">Namespace ticketing</text>

  <rect x="425" y="210" width="160" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="505" y="237" text-anchor="middle" font-weight="bold">frontend</text>
  <text x="505" y="259" text-anchor="middle" font-size="13">Service ClusterIP</text>
  <text x="505" y="279" text-anchor="middle" font-size="13">Pod 2개</text>
  <text x="505" y="299" text-anchor="middle" font-size="13">nginx · /api 전달</text>

  <rect x="630" y="210" width="160" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="710" y="237" text-anchor="middle" font-weight="bold">backend</text>
  <text x="710" y="259" text-anchor="middle" font-size="13">Service ClusterIP</text>
  <text x="710" y="279" text-anchor="middle" font-size="13">Pod 2개</text>
  <text x="710" y="299" text-anchor="middle" font-size="13">liveness · readiness</text>

  <rect x="840" y="140" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="920" y="167" text-anchor="middle" font-weight="bold">mysql</text>
  <text x="920" y="189" text-anchor="middle" font-size="13">Service ClusterIP</text>
  <text x="920" y="209" text-anchor="middle" font-size="13">Pod 1개</text>

  <rect x="840" y="255" width="160" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="920" y="283" text-anchor="middle" font-weight="bold" font-size="14">PVC 2Gi</text>
  <text x="920" y="304" text-anchor="middle" font-size="13">EBS gp3</text>
  <line x1="920" y1="230" x2="920" y2="253" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="840" y="360" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="920" y="387" text-anchor="middle" font-weight="bold">redis</text>
  <text x="920" y="409" text-anchor="middle" font-size="13">Service ClusterIP</text>
  <text x="920" y="429" text-anchor="middle" font-size="13">Pod 1개</text>

  <rect x="425" y="370" width="365" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="607" y="397" text-anchor="middle" font-weight="bold" font-size="14">ConfigMap · Secret · migrate Job</text>
  <text x="607" y="419" text-anchor="middle" font-size="13">문서 3(kubeadm 클러스터)과 같은 매니페스트</text>

  <!-- arrows -->
  <line x1="140" y1="265" x2="213" y2="265" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="80" y="322" text-anchor="middle" font-size="12">http://ALB 주소</text>
  <line x1="355" y1="265" x2="423" y2="265" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="585" y1="265" x2="628" y2="265" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="607" y="256" text-anchor="middle" font-size="12">/api</text>
  <line x1="790" y1="245" x2="838" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="790" y1="290" x2="838" y2="385" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ECR -->
  <rect x="400" y="505" width="300" height="55" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="528" text-anchor="middle" font-weight="bold" font-size="14">Amazon ECR</text>
  <text x="550" y="548" text-anchor="middle" font-size="13">ticketing-backend · ticketing-frontend (2.0, 2.1)</text>
  <line x1="550" y1="503" x2="550" y2="474" stroke="#111" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="715" y="537" font-size="12">노드가 이미지를 받음</text>
