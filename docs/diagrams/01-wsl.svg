<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="15" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="980" height="430" fill="#fff"/>

  <!-- Windows -->
  <rect x="20" y="20" width="940" height="390" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="34" y="44" font-size="14" fill="#444">Windows 11 PC</text>

  <rect x="40" y="170" width="150" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="115" y="200" text-anchor="middle" font-weight="bold">브라우저</text>
  <text x="115" y="222" text-anchor="middle" font-size="13">localhost:4173</text>

  <!-- WSL -->
  <rect x="240" y="60" width="700" height="330" fill="#f6f6f6" stroke="#111" stroke-width="1.5"/>
  <text x="256" y="86" font-weight="bold">WSL 2 · Ubuntu 24.04</text>

  <rect x="270" y="150" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="365" y="180" text-anchor="middle" font-weight="bold">frontend</text>
  <text x="365" y="203" text-anchor="middle" font-size="13">Node.js 24 · vite preview</text>
  <text x="365" y="223" text-anchor="middle" font-size="13">포트 4173</text>
  <text x="365" y="243" text-anchor="middle" font-size="13">정적 파일 + /api 전달</text>

  <rect x="520" y="150" width="180" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="610" y="180" text-anchor="middle" font-weight="bold">backend</text>
  <text x="610" y="203" text-anchor="middle" font-size="13">JDK 21 · java -jar app.jar</text>
  <text x="610" y="223" text-anchor="middle" font-size="13">포트 8080</text>
  <text x="610" y="243" text-anchor="middle" font-size="13">Spring Boot API</text>

  <rect x="760" y="105" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="840" y="133" text-anchor="middle" font-weight="bold">MySQL 8.0</text>
  <text x="840" y="155" text-anchor="middle" font-size="13">127.0.0.1:3306</text>
  <text x="840" y="175" text-anchor="middle" font-size="13">/var/lib/mysql</text>

  <rect x="760" y="225" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="840" y="253" text-anchor="middle" font-weight="bold">Redis 7.0</text>
  <text x="840" y="275" text-anchor="middle" font-size="13">127.0.0.1:6379</text>
  <text x="840" y="295" text-anchor="middle" font-size="13">세션 · 선점 · 대기열</text>

  <line x1="190" y1="205" x2="268" y2="205" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="214" y="196" text-anchor="middle" font-size="12">HTTP</text>

  <line x1="460" y1="205" x2="518" y2="205" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="489" y="196" text-anchor="middle" font-size="12">/api</text>

  <line x1="700" y1="185" x2="758" y2="155" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="225" x2="758" y2="265" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="256" y="345" font-size="13">예매 · 회원 · 공연 데이터: MySQL (영구 저장)</text>
  <text x="256" y="367" font-size="13">로그인 세션 · 좌석 선점 · 대기열: Redis (만료 시간이 있는 임시 데이터)</text>
</svg>
