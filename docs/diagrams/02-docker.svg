<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Malgun Gothic','Noto Sans KR',sans-serif" font-size="15" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#fff"/>

  <rect x="20" y="20" width="960" height="430" fill="none" stroke="#999" stroke-dasharray="6 4"/>
  <text x="34" y="44" font-size="14" fill="#444">WSL 2 · Ubuntu 24.04 · Docker Engine 29.10</text>

  <rect x="40" y="175" width="150" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="115" y="205" text-anchor="middle" font-weight="bold">브라우저</text>
  <text x="115" y="227" text-anchor="middle" font-size="13">localhost:8088</text>

  <!-- docker network -->
  <rect x="250" y="70" width="700" height="290" fill="#f6f6f6" stroke="#111" stroke-width="1.5"/>
  <text x="266" y="96" font-weight="bold">Docker 네트워크 ticketing-net</text>

  <rect x="280" y="155" width="190" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="375" y="185" text-anchor="middle" font-weight="bold">frontend</text>
  <text x="375" y="208" text-anchor="middle" font-size="13">ticketing-frontend:2.0</text>
  <text x="375" y="228" text-anchor="middle" font-size="13">nginx · 8080</text>
  <text x="375" y="248" text-anchor="middle" font-size="13">정적 파일 + /api 전달</text>

  <rect x="530" y="155" width="180" height="110" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="620" y="185" text-anchor="middle" font-weight="bold">backend</text>
  <text x="620" y="208" text-anchor="middle" font-size="13">ticketing-backend:2.0</text>
  <text x="620" y="228" text-anchor="middle" font-size="13">Spring Boot · 8080</text>
  <text x="620" y="248" text-anchor="middle" font-size="13">게시 포트 없음</text>

  <rect x="770" y="110" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="850" y="138" text-anchor="middle" font-weight="bold">mysql</text>
  <text x="850" y="160" text-anchor="middle" font-size="13">mysql:8.4 · 3306</text>
  <text x="850" y="180" text-anchor="middle" font-size="13">게시 포트 없음</text>

  <rect x="770" y="230" width="160" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="850" y="258" text-anchor="middle" font-weight="bold">redis</text>
  <text x="850" y="280" text-anchor="middle" font-size="13">redis:7-alpine · 6379</text>
  <text x="850" y="300" text-anchor="middle" font-size="13">게시 포트 없음</text>

  <rect x="530" y="290" width="180" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="620" y="311" text-anchor="middle" font-weight="bold" font-size="14">migrate (1회 실행)</text>
  <text x="620" y="330" text-anchor="middle" font-size="12">ticketing-backend:2.0 migrate</text>

  <line x1="190" y1="210" x2="278" y2="210" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="221" y="201" text-anchor="middle" font-size="12">8088→8080</text>
  <line x1="470" y1="210" x2="528" y2="210" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="499" y="201" text-anchor="middle" font-size="12">/api</text>
  <line x1="710" y1="190" x2="768" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="710" y1="230" x2="768" y2="270" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="710" y1="305" x2="800" y2="202" stroke="#111" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>

  <!-- volume -->
  <rect x="770" y="385" width="160" height="50" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="850" y="406" text-anchor="middle" font-weight="bold" font-size="14">볼륨 ticketing-mysql</text>
  <text x="850" y="425" text-anchor="middle" font-size="12">/var/lib/mysql</text>
  <path d="M940 155 L965 155 L965 410 L932 410" fill="none" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="266" y="385" font-size="13">컨테이너는 서로 이름(mysql, redis, backend)으로 찾는다.</text>
  <text x="266" y="407" font-size="13">호스트에 게시한 포트는 frontend의 8088 하나다.</text>
</svg>
